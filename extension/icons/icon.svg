<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C518;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB703;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#grad1)" stroke="#F5C518" stroke-width="4"/>
  <!-- Malayalam Letter 'സ' / 'ത' stylized or Eye/Accessibility Symbol -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#F5C518" stroke-width="4" stroke-dasharray="160 40" stroke-linecap="round"/>
  <!-- Central 'തു' or Human/Spark Icon -->
  <path d="M44 48 C44 38, 54 34, 64 34 C74 34, 84 38, 84 48 C84 62, 44 64, 44 80 C44 90, 56 94, 66 94 C76 94, 84 90, 84 82" 
        fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="6" fill="#38BDF8" />
  <circle cx="92" cy="36" r="4" fill="#F5C518" />
</svg>
